<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NPPF 2026 Navigator</title>
<meta name="description" content="An interactive decision route through the National Planning Policy Framework (August 2026): answer the facts and planning judgements a decision needs, see the verbatim policy text for each step, and compare with appeal and council decisions made under the new Framework. Not legal advice.">
<link rel="canonical" href="https://danmux.github.io/stratford-district-council/planning/nppf-navigator/">
<meta property="og:type" content="website">
<meta property="og:title" content="NPPF 2026 Navigator">
<meta property="og:description" content="An interactive decision route through the National Planning Policy Framework (August 2026): answer the facts and planning judgements a decision needs, see the verbatim policy text for each step, and compare with appeal and council decisions made under the new Framework. Not legal advice.">
<meta property="og:url" content="https://danmux.github.io/stratford-district-council/planning/nppf-navigator/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
:root {
  --ground: #eef2f1;
  --surface: #ffffff;
  --surface-2: #f6f8f8;
  --ink: #17212b;
  --muted: #5a6672;
  --line: #d5dddd;
  --accent: #2b5c88;
  --accent-ink: #ffffff;
  --accent-soft: #e3ecf4;
  --refuse: #a3382a;
  --refuse-soft: #f7e6e3;
  --approve: #2d7549;
  --approve-soft: #e3f1e8;
  --balanced: #94680f;
  --balanced-soft: #f6eedb;
  --quote: #f4f6f2;
  --focus: #2b5c88;
  --serif: "Source Serif 4", "Iowan Old Style", Georgia, serif;
  --sans: "Public Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #10161b; --surface: #18212a; --surface-2: #1d2731; --ink: #e3e9ee; --muted: #9aa6b2; --line: #2c3945;
    --accent: #86b0db; --accent-ink: #0e1a26; --accent-soft: #1f3244;
    --refuse: #e0786a; --refuse-soft: #3a211e; --approve: #6cc08f; --approve-soft: #1b3326; --balanced: #d9a94a; --balanced-soft: #3a2f17;
    --quote: #1c2620; --focus: #86b0db;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #10161b; --surface: #18212a; --surface-2: #1d2731; --ink: #e3e9ee; --muted: #9aa6b2; --line: #2c3945;
  --accent: #86b0db; --accent-ink: #0e1a26; --accent-soft: #1f3244;
  --refuse: #e0786a; --refuse-soft: #3a211e; --approve: #6cc08f; --approve-soft: #1b3326; --balanced: #d9a94a; --balanced-soft: #3a2f17;
  --quote: #1c2620; --focus: #86b0db;
}

* { box-sizing: border-box; }
body { background: var(--ground); color: var(--ink); font: 15px/1.55 var(--sans); padding-inline: 16px; padding-block: 0 40px; }
#app { max-width: 1240px; margin: 0 auto; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
p { margin: 0; }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.mono, .code, textarea.mono { font-family: var(--mono); }
.muted { color: var(--muted); }
.fine { font-size: 12.5px; color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.loading { padding-block: 48px; color: var(--muted); }

/* header */
.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between; padding-block: 22px 14px; }
.brand h1 { font: 600 26px/1.15 var(--serif); letter-spacing: -0.01em; }
.brand p { color: var(--muted); margin-top: 4px; max-width: 62ch; }
.top-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.confirm { display: inline-flex; gap: 8px; align-items: center; }
.banner { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 9px 12px; font-size: 13.5px; color: var(--muted); }
.banner strong { color: var(--ink); }

/* buttons */
.primary, .secondary, .danger { border-radius: 6px; padding: 8px 14px; cursor: pointer; font-weight: 600; font-size: 14px; }
.primary { background: var(--accent); color: var(--accent-ink); border: 1px solid var(--accent); }
.secondary { background: var(--surface); border: 1px solid var(--line); }
.secondary:hover { border-color: var(--accent); }
.danger { background: var(--refuse); color: var(--surface); border: 1px solid var(--refuse); }
.link { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-weight: 600; font-size: 13.5px; text-decoration: underline; text-underline-offset: 3px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 14px; }
.nav { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
.nav-right { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
.step-link { background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.step-link:hover { text-decoration-color: var(--accent); }

/* progress rail: the decision's real sequence */
.rail { margin-block: 14px 18px; overflow-x: auto; }
.rail ol { list-style: none; display: flex; gap: 0; margin: 0; padding: 0; min-width: max-content; counter-reset: step; }
.step { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--muted); padding-right: 18px; position: relative; }
.step:not(:last-child)::after { content: ""; width: 12px; height: 1px; background: var(--line); margin-left: 4px; }
.step .dot { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--muted); flex: none; }
.step.done { color: var(--ink); }
.step.done .dot { background: var(--accent); border-color: var(--accent); }
.step.current { color: var(--ink); font-weight: 600; }
.step.current .dot { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); background: var(--surface); }
.step.skipped { opacity: .55; text-decoration: line-through; text-decoration-color: var(--line); }

/* layout */
.grid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.flow { display: grid; gap: 16px; }
.context { display: grid; gap: 16px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); max-height: calc(100vh - 24px); overflow-y: auto; padding-right: 2px; }
@media (max-width: 860px) {
  .grid { grid-template-columns: 1fr; }
  .context { position: static; max-height: none; overflow: visible; }
}

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 22px; }
.eyebrow { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.eyebrow .tag { background: var(--balanced-soft); color: var(--balanced); border-radius: 3px; padding: 1px 6px; letter-spacing: .04em; }
.node h2 { font: 600 22px/1.25 var(--serif); margin-top: 8px; }
.node.k-judgement { border-top: 3px solid var(--accent); }
.prompt { margin-top: 8px; font-size: 16px; max-width: 64ch; }
.why { margin-top: 14px; font-size: 12.5px; color: var(--muted); }

.choices { display: grid; gap: 8px; margin-top: 16px; }
.choice { text-align: left; background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 11px 13px; cursor: pointer; display: grid; gap: 3px; }
.choice:hover { border-color: var(--accent); }
.choice.chosen { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.choice-label { font-weight: 600; }
.choice-help { font-size: 13px; color: var(--muted); }
.multi { display: grid; gap: 6px; margin-top: 16px; }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 9px 11px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); cursor: pointer; }
.check input { margin-top: 4px; accent-color: var(--accent); }
.number { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 16px; }
.number input { width: 8em; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); font: 600 16px var(--sans); font-variant-numeric: tabular-nums; }
.unit { color: var(--muted); }

details.help { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 12px; }
details.help summary { cursor: pointer; font-weight: 600; font-size: 13.5px; color: var(--accent); }
details.help ul { margin: 10px 0 0; padding-left: 18px; display: grid; gap: 6px; font-size: 14px; }

/* Framework text: the Framework speaking */
.quotes h3, .contested h3, .cases h3, .answers h3, .reasons h3 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.quotes { display: grid; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
blockquote.fw { margin: 0; background: var(--quote); border-radius: 4px; padding: 12px 14px; }
.fw-head { display: flex; gap: 8px; align-items: baseline; font-size: 12.5px; color: var(--muted); margin-bottom: 5px; }
.fw p { font: 400 15.5px/1.55 var(--serif); }
.code { font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--accent); white-space: nowrap; }

.contested { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--balanced); border-radius: 8px; padding: 16px; display: grid; gap: 12px; }
.reading { display: grid; gap: 8px; }
.reading h4 { font-size: 14px; }
.reading .cases { border: 0; padding: 0; background: none; }

/* decisions */
.cases { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: grid; gap: 10px; }
.cases-head { display: flex; gap: 8px; align-items: baseline; }
.count { font: 500 12px var(--mono); color: var(--muted); background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 0 7px; margin-left: 6px; font-variant-numeric: tabular-nums; }
.group { display: grid; gap: 6px; }
.group h4 { font-size: 13.5px; display: flex; align-items: center; }
.case-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.case { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; display: grid; gap: 5px; background: var(--surface-2); }
.case-head { display: flex; gap: 10px; justify-content: space-between; align-items: baseline; }
.case-title { font-weight: 600; }
.case-meta { font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 0 4px; align-items: baseline; }
.flag { margin-left: 6px; font-size: 11.5px; color: var(--balanced); }
.case-finding { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
.finding, .weight, .pill { font-size: 11.5px; font-weight: 600; border-radius: 3px; padding: 1px 6px; text-transform: lowercase; }
.pill { flex: none; }
.pill.ok, .finding.f-pass, .finding.f-accord, .finding.f-benefit { background: var(--approve-soft); color: var(--approve); }
.pill.no, .finding.f-fail, .finding.f-harm, .finding.f-conflict { background: var(--refuse-soft); color: var(--refuse); }
.finding.f-neutral, .finding.f-not-engaged { background: var(--surface); color: var(--muted); border: 1px solid var(--line); }
.weight { background: var(--accent-soft); color: var(--accent); }
.case-note { font-size: 13.5px; }
.case-links { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; }
.case-summary { border-top: 1px solid var(--line); padding-top: 8px; font-size: 13.5px; }
.md { display: grid; gap: 8px; }
.md h4 { font-size: 13px; margin-top: 4px; }
.md ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.md code { font-family: var(--mono); font-size: 12px; }

/* answers so far */
.answers { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: grid; gap: 12px; }
.answer-group h4 { font-size: 13px; margin-bottom: 4px; }
.answers dl { margin: 0; display: grid; }
.answer { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); gap: 12px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
.answer dt { color: var(--muted); }
.answer dd { margin: 0; display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.answer.editing dd { color: var(--accent); }
@media (max-width: 480px) { .answer { grid-template-columns: 1fr; gap: 2px; } }

/* outcome */
.outcome { border-top: 5px solid var(--muted); }
.outcome.v-refuse { border-top-color: var(--refuse); }
.outcome.v-approve { border-top-color: var(--approve); }
.outcome.v-balanced { border-top-color: var(--balanced); }
.verdict { display: grid; gap: 4px; margin-top: 10px; }
.verdict-word { font: 600 34px/1.05 var(--serif); letter-spacing: -0.01em; }
.v-refuse .verdict-word { color: var(--refuse); }
.v-approve .verdict-word { color: var(--approve); }
.v-balanced .verdict-word { color: var(--balanced); }
.verdict h2 { font: 400 19px/1.35 var(--serif); }
.test { margin-top: 10px; max-width: 66ch; }
.reasons { display: grid; gap: 16px; margin-top: 18px; }
.reason-list { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; }
.reason { display: grid; grid-template-columns: 9.5em minmax(0, 1fr) auto; gap: 4px 12px; align-items: baseline; padding: 8px 10px; border-radius: 6px; background: var(--surface-2); border-left: 3px solid var(--line); font-size: 14px; }
.reason .weight, .reason .link { grid-column: 3; justify-self: end; }
.reason .weight { grid-row: 1; }
.reason.r-trigger, .reason.r-fail { border-left-color: var(--refuse); }
.reason.r-harm { border-left-color: var(--balanced); }
.reason.r-benefit, .reason.r-pass { border-left-color: var(--approve); }
.reason.r-route { border-left-color: var(--accent); }
.reason.focused { box-shadow: 0 0 0 2px var(--accent); }
@media (max-width: 560px) { .reason { grid-template-columns: 1fr; } .reason .weight, .reason .link { grid-column: 1; grid-row: auto; justify-self: start; } }
.disclaimer-inline { margin-top: 18px; font-size: 13px; color: var(--muted); max-width: 66ch; }

.notice { background: var(--balanced-soft); color: var(--ink); border-radius: 6px; padding: 9px 12px; font-size: 13.5px; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; }
.about h2, .io h2 { font: 600 20px var(--serif); }
.about, .io { display: grid; gap: 10px; }
.about ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.about h3 { font-size: 14px; margin-top: 6px; }
.io label { font-weight: 600; font-size: 13.5px; }
.io textarea { width: 100%; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); color: var(--ink); padding: 8px; font-size: 12.5px; }
.rm-fig { margin: 0; display: grid; gap: 8px; }
.rm-fig figcaption { font-size: 13px; color: var(--muted); max-width: 70ch; }
.rm { width: 100%; height: auto; max-width: 760px; font-family: var(--sans); }
.rm-box rect { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
.rm-box.k-route rect { fill: var(--surface-2, var(--surface)); stroke: var(--muted); }
.rm-box.k-approve rect { fill: var(--approve-soft); stroke: var(--approve); }
.rm-box.k-refuse rect { fill: var(--refuse-soft); stroke: var(--refuse); }
.rm-box.on rect { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2.2; }
.rm-box.k-approve.on rect { fill: var(--approve); stroke: var(--approve); }
.rm-box.k-refuse.on rect, .rm-box.failed rect { fill: var(--refuse); stroke: var(--refuse); }
.rm-box.k-approve.on text, .rm-box.k-refuse.on text, .rm-box.failed text { fill: var(--accent-ink); }
.rm-title { font-size: 12.5px; font-weight: 600; fill: var(--ink); }
.rm-sub { font-size: 11px; fill: var(--muted); }
.rm-band { fill: none; stroke: var(--line); stroke-dasharray: 5 4; }
.rm-band.on { stroke: var(--accent); }
.rm-band-label { font-size: 11px; fill: var(--muted); }
.rm-edge { fill: none; stroke: var(--muted); stroke-width: 1.2; opacity: .7; }
.rm-edge.on { stroke: var(--accent); stroke-width: 2.4; opacity: 1; }
.rm-head { fill: var(--muted); }
.rm-head.on { fill: var(--accent); }
.rm-elabel { font-size: 11px; fill: var(--muted); }
.rm-elabel.on { fill: var(--accent); font-weight: 600; }
.kind-note { margin-top: 10px; font-size: 13px; color: var(--muted); }
.kind-note.kn-judgement { color: var(--ink); background: var(--accent-soft); border-radius: 6px; padding: 7px 10px; }
details.method { margin-top: 14px; border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 6px; padding: 10px 14px; background: var(--surface-2); }
details.method summary { cursor: pointer; font-weight: 600; font-size: 14px; color: var(--accent); }
.method-q { margin-top: 8px; font: 600 15.5px/1.45 var(--serif); }
.method-steps { margin: 8px 0 0; padding-left: 20px; display: grid; gap: 5px; font-size: 14px; }
.method-pointers { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-top: 12px; }
.pointer { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
.pointer h4, .method-evidence h4 { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.pointer h4 span { color: var(--ink); }
.pointer ul, .method-evidence ul { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 4px; font-size: 13.5px; }
.method-evidence { margin-top: 12px; }
.method-close { margin-top: 12px; font-size: 13.5px; }
.jtag { margin-left: 6px; font-size: 10.5px; font-weight: 600; letter-spacing: .03em; color: var(--accent); background: var(--accent-soft); border-radius: 3px; padding: 0 5px; vertical-align: 1px; }
.foot { margin-top: 28px; font-size: 12px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div id="app"><p class="loading">Loading the Framework and decisions…</p></div>
<script type="module" src="app.js"></script>
</body>
</html>
